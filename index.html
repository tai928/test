<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Type Bloom - TextAlive MV</title>

  <link rel="stylesheet" href="./style.css" />
</head>

<body>
  <main class="mv">
    <!-- 背景シーン -->
    <div id="sceneVerse1" class="scene scene-verse-1 active" aria-hidden="true"></div>
    <div id="sceneVerse2" class="scene scene-verse-2" aria-hidden="true"></div>
    <div id="sceneChorus" class="scene scene-chorus" aria-hidden="true"></div>

    <!-- サビ専用の華やか世界 -->
    <div id="chorusWorld" class="chorus-world" aria-hidden="true">
      <div class="chorus-gradient"></div>
      <div class="burst-ring ring-1"></div>
      <div class="burst-ring ring-2"></div>
      <div class="burst-ring ring-3"></div>
      <div id="burstParticles" class="burst-particles"></div>
    </div>

    <!-- 質感レイヤー -->
    <div class="dark-overlay"></div>
    <div class="light-overlay"></div>
    <div class="noise"></div>
    <div class="scanline"></div>
    <div class="vignette"></div>
    <div id="chorusFlash" class="chorus-flash"></div>

    <!-- 歌詞 -->
    <section class="lyrics">
      <p id="prevLyric" class="prev-lyric"></p>

      <div class="main-line">
        <h1 id="mainLyric" class="main-lyric">Loading...</h1>
      </div>

      <p id="subLyric" class="sub-lyric"></p>
    </section>

    <!-- 最小UI -->
    <div class="controls">
      <button id="playButton" class="play-button" type="button">Play</button>
      <div id="time" class="time">0.0s</div>
    </div>

    <!-- TextAlive用。画面には見せない -->
    <div id="media" class="hidden-media"></div>
  </main>

  <script src="https://unpkg.com/axios/dist/axios.min.js"></script>
  <script src="https://unpkg.com/textalive-app-api/dist/index.js"></script>
  <script src="./script.js"></script>
</body>
</html>
